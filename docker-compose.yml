version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root3306  # 你可以修改这个密码
      MYSQL_DATABASE: mydatabase           # 初始创建的数据库名
      MYSQL_USER: developer                # 普通用户
      MYSQL_PASSWORD: abcd1234       # 普通用户密码
    ports:
      - "3307:3306"  # 本地端口:容器端口
    volumes:
      - mysql_data:/var/lib/mysql  # 数据持久化
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: